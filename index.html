<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Service Portal — ศูนย์รวมบริการและเว็บไซต์ที่เปิดใช้งาน</title>
<meta name="description" content="รวมเว็บไซต์และบริการที่พร้อมใช้งานไว้ในที่เดียว" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow"></div>
<div id="cursor" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-container">
    <a href="#top" class="brand">
      <span class="brand-icon"><i data-lucide="monitor"></i></span>
      <span class="brand-name serif">Service Portal</span>
    </a>
    <div class="search-box">
      <i data-lucide="search" class="search-icon"></i>
      <input type="text" id="searchInput" placeholder="ค้นหาบริการ..." />
    </div>
  </div>
</header>

<main id="top">
  <section class="hero-section">
    <p class="pill" data-aos="fade-up"><span class="dot"></span>ทุกบริการพร้อมใช้งาน</p>
    <h1 class="hero-title serif grad" data-aos="fade-up" data-aos-delay="100">ศูนย์รวมบริการและเว็บไซต์ที่เปิดใช้งาน</h1>
    <p class="hero-typed" data-aos="fade-up" data-aos-delay="200">เข้าถึง<span id="typed" class="serif"></span><span class="caret"></span></p>
    <p class="hero-subtitle" data-aos="fade-up" data-aos-delay="300">รวมเว็บไซต์และบริการที่พร้อมใช้งานไว้ในที่เดียว</p>
    <div class="hero-cta" data-aos="fade-up" data-aos-delay="400">
      <a href="#story" class="btn btn-primary">เลื่อนชมบริการ <i data-lucide="arrow-down" class="arrow"></i></a>
      <a href="#services" class="btn btn-ghost">ดูทั้งหมด <i data-lucide="arrow-right" class="arrow"></i></a>
    </div>
    <div class="scroll-hint" aria-hidden="true"><span></span></div>
  </section>

  <!-- Scroll-driven story: one scene per service (built by app.js) -->
  <section id="story" class="story">
    <div class="stage">
      <div id="scenes" class="scenes"></div>
      <div id="captions" class="captions"></div>
      <nav id="dots" class="dots" aria-label="เลือกบริการ"></nav>
      <div class="vignette"></div>
    </div>
  </section>

  <section id="services" class="projects-section">
    <div class="section-meta" data-aos="fade-up">
      <h2 class="section-title serif">บริการทั้งหมด</h2>
      <span class="count-badge" id="projectCount">6 รายการ</span>
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </section>
</main>

<footer class="site-footer">
  <p>© 2026 Service Portal • ศูนย์รวมบริการและเว็บไซต์ที่เปิดใช้งาน</p>
</footer>



<script src="app.js"></script>
</body>
</html>
